<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTX — all roles</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 4px; padding: 6px 8px; background: #1d1d1f; overflow-x: auto; flex: none; position: sticky; top: 0; z-index: 5; }
  #bar button { flex: none; background: #333; color: #fff; border-color: #444; position: relative; }
  #bar button.active { background: var(--accent); border-color: var(--accent); }
  #bar .dot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: #ffb000; display: none; }
  #bar .dot.on { display: block; }
  #frames { flex: 1; position: relative; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); visibility: hidden; }
  #frames iframe.active { visibility: visible; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="frames"></div>
<script type="module">
// One window, every role: each role's page lives in its own iframe (kept
// loaded, so switching is instant). A dot marks roles with unread messages.
import { api, accessToken } from './common.js?v=role-access-1';

const access = await api('/api/access');
if (access.kind !== 'master') { location.replace(`player.html?role=${access.role}&token=${encodeURIComponent(accessToken())}`); throw new Error('Master access required'); }
const s = await api('/api/static');
const tabs = [{ id: 'master', label: 'Director', src: 'master.html' }]
  .concat(s.roles.map(r => ({ id: r.id, label: r.name.split(' ')[0], full: r.name, src: `player.html?role=${r.id}` })));
const bar = document.getElementById('bar'), frames = document.getElementById('frames');
const seen = {};
let current = null;

function show(id) {
  current = id;
  for (const t of tabs) {
    t.btn.classList.toggle('active', t.id === id);
    t.frame.classList.toggle('active', t.id === id);
  }
  seen[id] = counts[id] ?? 0;
  t_dot(id, false);
  try { localStorage.setItem('ttx-tab', id); } catch {}
}
function t_dot(id, on) { tabs.find(t => t.id === id).dot.classList.toggle('on', on); }

for (const t of tabs) {
  t.btn = document.createElement('button');
  t.btn.textContent = t.label;
  t.btn.title = t.full || t.label;
  t.dot = document.createElement('span'); t.dot.className = 'dot';
  t.btn.appendChild(t.dot);
  t.btn.onclick = () => show(t.id);
  bar.appendChild(t.btn);
  t.frame = document.createElement('iframe');
  t.frame.src = `${t.src}${t.src.includes('?') ? '&' : '?'}token=${encodeURIComponent(accessToken())}`;
  t.frame.title = t.label;
  frames.appendChild(t.frame);
}

// Unread markers: inbox sizes for players, open proposals for the Director.
const counts = {};
async function poll() {
  try {
    const m = await api('/api/master');
    counts.master = m.proposals.filter(p => ['pending', 'needs_clarification'].includes(p.status)).length;
    for (const r of s.roles) counts[r.id] = m.messages.filter(x => x.to === r.id).length;
    for (const t of tabs) {
      if (seen[t.id] === undefined) seen[t.id] = counts[t.id];
      if (t.id === current) seen[t.id] = counts[t.id];
      t_dot(t.id, t.id === 'master' ? counts.master > 0 && current !== 'master' : counts[t.id] > seen[t.id]);
    }
  } catch {}
}
let start = 'master';
try { start = localStorage.getItem('ttx-tab') || 'master'; } catch {}
show(tabs.some(t => t.id === start) ? start : 'master');
poll();
setInterval(poll, 2500);
</script>
</body>
</html>
