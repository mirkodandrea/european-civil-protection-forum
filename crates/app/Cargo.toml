[package]
name = "app"
default-run = "ttx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The ttx binary: simulator + web server + (optionally) the Bevy big-screen renderer"

[[bin]]
name = "ttx"
path = "src/main.rs"

[features]
default = ["viz"]
viz = ["dep:viz"]

[dependencies]
scenario.workspace = true
sim.workspace = true
exercise.workspace = true
llm.workspace = true
server.workspace = true
viz = { workspace = true, optional = true }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy = "0.15"

[[bin]]
name = "scenario-editor"
path = "src/bin_scenario_editor.rs"
required-features = ["viz"]

[[bin]]
name = "translate-territory"
path = "src/bin_translate_territory.rs"
