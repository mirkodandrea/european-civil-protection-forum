[package]
name = "viz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy big-screen renderer: 3D terrain, vegetation, fire, buildings, actions, turn replay and HUD"

[dependencies]
scenario.workspace = true
view.workspace = true
serde_json.workspace = true
serde.workspace = true
rand.workspace = true
rand_chacha.workspace = true
bevy = { version = "0.20", default-features = false }
bevy_egui = { version = "0.43.1", default-features = false, features = ["open_url", "default_fonts", "render"] }
bytemuck = "1"
# the landscape terrain's adaptive mesh (`land::terrain_tin`)
spade = "2.13"
# Only for the timestamp queries of `bench.rs` (same major as Bevy uses).
wgpu = { version = "30", default-features = false }

[features]
# The shader library's WebGPU variants (`shader_lib`), as in `propagator_abm`.
webgpu = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser needs no Bevy UI/text renderer, glTF/scene loaders or animation.
bevy = { version = "0.20", default-features = false, features = [
    "default_app", "std", "bevy_winit", "webgl2", "png",
    "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_post_process",
    "bevy_anti_alias", "bevy_gizmos_render",
    "tonemapping_luts", "smaa_luts", "ktx2", "zstd_rust",
] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", default-features = true }
bevy_egui = { version = "0.43.1", default-features = false, features = ["manage_clipboard"] }
