name: Standalone WebAssembly and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      verify_standalone:
        description: Run the standalone browser verification
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.92.0
  CARGO_TERM_COLOR: always
  OPENROUTER_API_KEY: ''
  TTX_LLM_CASSETTE: ''

jobs:
  build:
    name: Test and build the self-contained app
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust and WebAssembly target
        run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - name: Test shared model and exercise controllers
        run: cargo test --locked --release -p server -p exercise -p llm
      - name: Install pinned Trunk
        run: cargo install trunk --version 0.21.14 --locked
      - name: Build standalone WebAssembly
        run: ./scripts/build_standalone.sh
      - name: Stage only the self-contained public app
        run: |
          mkdir -p _site
          cp web/standalone/ttx.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/record/package-lock.json
      - name: Install browser fixture dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.verify_standalone
        run: |
          npm ci --prefix scripts/record
          scripts/record/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify the staged app offline with real commands
        if: github.event_name == 'workflow_dispatch' && inputs.verify_standalone
        env:
          TTX_BROWSER_CHANNEL: chromium
          TTX_STANDALONE_FILE: _site/index.html
        run: node scripts/qa/standalone.cjs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        uses: actions/configure-pages@v5
      - name: Upload the tested Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
