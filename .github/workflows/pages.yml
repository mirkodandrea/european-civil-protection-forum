name: Standalone WebAssembly and Pages

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      verify_standalone:
        description: Run the full offline browser verification (slow on software GPUs)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Every deployment contains both branches. Serialize them across all refs.
concurrency:
  group: pages-dual-standalone
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.92.0
  CARGO_TERM_COLOR: always
  OPENROUTER_API_KEY: ''
  TTX_LLM_CASSETTE: ''

jobs:
  build:
    name: Test and build ${{ matrix.branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dev]
    steps:
      - uses: actions/checkout@v7
        with:
          # Test proposed changes on their target branch, without deploying PRs.
          ref: ${{ github.event_name == 'pull_request' && matrix.branch == github.base_ref && github.event.pull_request.head.sha || matrix.branch }}
          persist-credentials: false
      - name: Record source revision
        run: git rev-parse HEAD > /tmp/source-revision
      - name: Install Rust and WebAssembly target
        run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - name: Cache Rust dependencies and branch build outputs
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.92-${{ matrix.branch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.92-${{ matrix.branch }}-
      - name: Cache pinned WebAssembly build tool
        id: build-tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-tool-${{ matrix.branch }}-trunk-0.21.14-bindgen-0.2.129-rust-1.92
      - name: Test shared model and exercise controllers
        run: cargo test --locked --release -p server -p exercise -p llm
      - name: Install pinned Trunk for dev
        if: matrix.branch == 'dev' && steps.build-tool.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 -o /tmp/trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo 'f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  /tmp/trunk.tar.gz' | sha256sum --check
          tar -xzf /tmp/trunk.tar.gz -C /tmp
          install /tmp/trunk ~/.cargo/bin/trunk
      - name: Install pinned wasm-bindgen for main
        if: matrix.branch == 'main' && steps.build-tool.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 -o /tmp/bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/bindgen.tar.gz' | sha256sum --check
          tar -xzf /tmp/bindgen.tar.gz -C /tmp
          install /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen ~/.cargo/bin/wasm-bindgen
      - name: Build standalone WebAssembly
        run: ./scripts/build_standalone.sh
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch' && inputs.verify_standalone
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/record/package-lock.json
      - name: Install browser fixture dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.verify_standalone
        run: |
          npm ci --prefix scripts/record
          # Ubuntu's runner image includes Chrome and its system libraries.
          google-chrome --version
      - name: Verify the app offline with real commands
        if: github.event_name == 'workflow_dispatch' && inputs.verify_standalone
        env:
          TTX_BROWSER_CHANNEL: chrome
        run: node scripts/qa/standalone.cjs
      - name: Stage the tested branch
        env:
          TTX_BRANCH: ${{ matrix.branch }}
        run: |
          mkdir -p _branch
          cp web/standalone/ttx.html _branch/index.html
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('_branch/version.json').write_text(json.dumps({
              'branch': os.environ['TTX_BRANCH'],
              'commit': Path('/tmp/source-revision').read_text().strip(),
              'run': os.environ['GITHUB_RUN_ID'],
          }) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.branch }}
          path: _branch
          retention-days: 7
      - name: Preserve compiled outputs for verification retries
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.92-${{ matrix.branch }}-${{ hashFiles('Cargo.lock') }}
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.branch }}
          path: runs/standalone-review
          if-no-files-found: ignore
          retention-days: 7

  assemble:
    name: Assemble both standalone versions
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: standalone-main
          path: _site/main
      - uses: actions/download-artifact@v4
        with:
          name: standalone-dev
          path: _site/dev
      - name: Build the version chooser
        run: python3 scripts/stage_pages.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish both versions on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
