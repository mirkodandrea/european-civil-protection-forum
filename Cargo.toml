[workspace]
resolver = "2"
members = [
    "crates/propagator-core",
    "crates/scenario",
    "crates/fire",
    "crates/sim",
    "crates/llm",
    "crates/exercise",
    "crates/server",
    "crates/frontend",
    "crates/view",
    "crates/viz",
    "crates/viewer",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[workspace.dependencies]
propagator-core = { path = "crates/propagator-core" }
scenario = { path = "crates/scenario" }
fire = { path = "crates/fire" }
sim = { path = "crates/sim" }
llm = { path = "crates/llm" }
exercise = { path = "crates/exercise" }
server = { path = "crates/server" }
view = { path = "crates/view" }
viz = { path = "crates/viz" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

# The fire core and Bevy are unusably slow unoptimised.
[profile.dev.package."*"]
opt-level = 3
